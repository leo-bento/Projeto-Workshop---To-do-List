<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
</head>

<body>
    <div class="base-container">
        <div class="container" id="title">
            <header>
                <h1>QuestLog</h1>
                <p>Transforme sua jornada em uma rotina de alto nível cadastrando e gerenciando suas Quests</p>
            </header>
        </div>
        <div class="container" id="register">
            <h2>Cadastre uma nova Quest</h2>
            <form>
                <label for="titulo">Título</label>
                <input style="text-align: center;" type="text" id="titulo" placeholder="O que voce quer fazer?">
                <label for="descricao">Descrição</label>
                <input style="text-align: center;" type="text" id="descricao" placeholder="Como voce quer fazer?">
                <button type="submit" onclick="addTask()">Aceitar nova Quest</button>
                
            </form>
        </div>
        <div class="container" id="log">
            <h2>Quest Ativas</h2>
            <ul id="list-container">
                <li>Task 1<br>
                    <span>Description 1</span></li>
                <li>Task 2<br>
                    <span>Description 2</span></li>
                <li>Task 3<br>
                    <span>Description 3</span></li>
                <li>Task 4<br>
                    <span>Descrption 4</span></li>
                <li>Task 5<br>
                    <span>Descrption 5</span></li>
            </ul>
        </div>
    </div>
    
</body>

</html>
