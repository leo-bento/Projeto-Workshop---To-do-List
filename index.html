<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="base-container">
        <div class="container" id="title">
            <header>
                <h1>QuestLog</h1>
                <p>Transforme sua jornada em uma rotina de alto nível cadastrando e gerenciando suas Quests</p>
            </header>
        </div>
        <div class="container" id="register">
            <h2>Cadastre uma nova Quest</h2>
            <form>
                <label for="titulo">Título</label>
                <input style="text-align: center;" type="text" id="titulo" placeholder="O que voce quer fazer?">
                <label for="descricao">Descrição</label>
                <input style="text-align: center;" type="text" id="descricao"
                    placeholder="Como voce quer fazer?"></input>
                <button type="submit">Criar nova tarefa</button>
            </form>
        </div>
        <div class="container" id="log">
            <h2>Quest Ativas</h2>
        </div>
    </div>
</body>

</html>
